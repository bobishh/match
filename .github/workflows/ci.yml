name: Verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test

  browser-core:
    name: Browser (core)
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --project=core

  browser-network:
    name: Browser (${{ matrix.project }})
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      # Iroh relay sessions can linger after Chromium exits. Serial projects keep
      # remote relay traffic isolated; each project still gets a fresh runner.
      max-parallel: 1
      matrix:
        project:
          - chat
          - durable-mesh
          - sync
          - workspace-roles
          - workspace-sync-data
          - scoped-sync
          - scoped-enrollment
          - scoped-existing-board
          - scoped-existing-identity
          - scoped-delegated-owner
          - succession-named
          - succession-quorum
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --project=${{ matrix.project }}
