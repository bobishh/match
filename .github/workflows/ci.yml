name: Verify

on:
  push:
    branches: [main]
  pull_request:

# Direct pushes often arrive in bursts while an agent is iterating. Keep only
# the newest run for a branch instead of billing every obsolete commit.
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify:meta-mesh
      - run: npm run quality
      - run: npm test
      - run: npm run quality:size
      - run: npm audit --audit-level=moderate

  browser-core:
    name: Browser (core)
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify:meta-mesh
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --project=core

  browser-network:
    name: Browser (${{ matrix.project }})
    # Core browser coverage is faster and broader. Do not spend a full network
    # matrix when that prerequisite already failed.
    needs: [verify, browser-core]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      # Projects run serially. Stop scheduling the remaining matrix after the
      # first failure; the next push supersedes this run through concurrency.
      fail-fast: true
      # Iroh relay sessions can linger after Chromium exits. Serial projects keep
      # remote relay traffic isolated; each project still gets a fresh runner.
      max-parallel: 1
      matrix:
        project:
          - scoped-delegated-owner
          - chat
          - durable-mesh
          - member-access
          - sync
          - workspace-roles
          - workspace-sync-data
          - scoped-sync
          - scoped-enrollment
          - scoped-existing-board
          - scoped-existing-identity
          - succession-named
          - succession-quorum
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify:meta-mesh
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --project=${{ matrix.project }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-${{ matrix.project }}-failure
          path: test-results/
          retention-days: 3

  browser-native:
    name: Browser (native Rust peer)
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify:meta-mesh
      - run: npx playwright install --with-deps chromium
      - run: cargo build --locked --manifest-path vendor/meta-mesh/crates/meta-mesh-native/Cargo.toml --example browser_document_probe
      - run: npx playwright test --project=browser-native
