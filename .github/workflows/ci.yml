name: Verify

on:
  push:
    branches: [main]
  pull_request:

# Direct pushes often arrive in bursts while an agent is iterating. Keep only
# the newest run for a branch instead of billing every obsolete commit.
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify:meta-mesh
      - name: Verify Ubuntu mirror rewrite fixtures
        run: bash scripts/use-primary-ubuntu-mirror.test.sh
      - name: Verify Match receive mutation contract
        run: MATCH_ROOT="$GITHUB_WORKSPACE" python3 vendor/meta-mesh/formal/check_match_mutations.py
      - run: npm run verify:policy
      - run: npm run quality
      - run: npm run test:coverage
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: unit-coverage
          path: coverage/
          retention-days: 14
      - name: Verify frontend deployment adapter
        run: node --test workers/frontend/*.test.mjs
      - name: Build checked production frontend
        env:
          VITE_SYNC_TELEMETRY_URL: ${{ vars.VITE_SYNC_TELEMETRY_URL }}
          VITE_SYNC_TELEMETRY_PROJECT: tincanban
          VITE_SYNC_TELEMETRY_BROWSER_KEY: ${{ vars.VITE_SYNC_TELEMETRY_BROWSER_KEY }}
          VITE_SYNC_TELEMETRY_LEVEL: ${{ vars.VITE_SYNC_TELEMETRY_LEVEL || 'all' }}
          VITE_SYNC_TELEMETRY_SAMPLE_RATE: ${{ vars.VITE_SYNC_TELEMETRY_SAMPLE_RATE || '1' }}
          VITE_SYNC_TELEMETRY_BATCH_SIZE: ${{ vars.VITE_SYNC_TELEMETRY_BATCH_SIZE || '50' }}
        run: npm run quality:size
      - run: npm audit --audit-level=moderate
      - name: Seal checked build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: node workers/frontend/release.mjs seal "$GITHUB_SHA"
      - uses: actions/upload-artifact@v6
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: tincanban-frontend-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

  formal-models:
    name: Match formal models
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Install pinned TLC
        env:
          TLC_SHA256: 936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88
        run: |
          jar="$RUNNER_TEMP/tla2tools-1.7.4.jar"
          curl -fL https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar -o "$jar"
          printf '%s  %s\n' "$TLC_SHA256" "$jar" | sha256sum --check --status
          java -version
      - name: Check Match TLA+ scenarios
        env:
          TLC_JAR: ${{ runner.temp }}/tla2tools-1.7.4.jar
          TLC_LOGS: ${{ runner.temp }}/match-tlc
        run: python3 verification/tla/run_models.py --logs "$TLC_LOGS"

  browser-core:
    name: Browser (core ${{ matrix.shard }})
    needs: [verify, formal-models]
    runs-on: ubuntu-24.04
    # Chromium setup takes ~5 minutes on fresh runners; leave time for full
    # shard execution and its configured retry without changing test limits.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: ["1/4", "2/4", "3/4", "4/4"]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify:meta-mesh
      - name: Use Ubuntu primary archive mirror for Chromium dependencies
        run: bash scripts/use-primary-ubuntu-mirror.sh
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --reporter=list --project=core --shard=${{ matrix.shard }}
      - uses: actions/upload-artifact@v6
        if: failure() || cancelled()
        with:
          name: core-failure-${{ strategy.job-index }}
          path: test-results/
          retention-days: 3

  browser-network:
    name: Browser (serial network projects)
    # Run after the Rusty lifecycle contract to keep real Iroh relay traffic
    # isolated, while still collecting network results when earlier browser
    # work fails.
    needs: [verify, formal-models, browser-core, browser-keeper-lifecycle]
    if: ${{ !cancelled() && needs.verify.result == 'success' && needs.formal-models.result == 'success' && (needs.browser-keeper-lifecycle.result == 'success' || needs.browser-keeper-lifecycle.result == 'failure') }}
    runs-on: ubuntu-24.04
    # Run each project in order in one runner. Keep the per-project timeout;
    # Playwright starts a fresh browser and web server for every invocation.
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify:meta-mesh
      - name: Use Ubuntu primary archive mirror for Chromium dependencies
        run: bash scripts/use-primary-ubuntu-mirror.sh
      - run: npx playwright install --with-deps chromium
      - name: Run network browser projects serially
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p test-results
          failed=0
          for project in \
            scoped-delegated-owner \
            chat \
            durable-mesh \
            member-access \
            sync \
            workspace-roles \
            workspace-sync-data \
            scoped-sync \
            scoped-enrollment \
            scoped-existing-board \
            scoped-existing-identity \
            succession-named \
            succession-quorum; do
            project_timeout=10m
            if [[ "$project" == durable-mesh ]]; then project_timeout=20m; fi
            echo "::group::Browser ($project)"
            if timeout --signal=INT --kill-after=30s "$project_timeout" \
              npx playwright test --reporter=list --project="$project" \
                --output="test-results/$project"; then
              echo "$project: passed" | tee -a test-results/network-summary.txt
            else
              result=$?
              echo "$project: failed (exit $result)" | tee -a test-results/network-summary.txt
              failed=1
            fi
            echo "::endgroup::"
          done
          exit "$failed"
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: browser-network-failure
          path: test-results/
          retention-days: 3

  browser-keeper-lifecycle:
    name: Browser (Rusty keeper lifecycle)
    # Run before Iroh-backed projects for fast feedback. Rusty, native-peer,
    # and browser-network share relay infrastructure, so wait for both other
    # relay users before starting Rusty; the network matrix waits for Rusty.
    needs: [verify, formal-models, browser-core, browser-native]
    if: ${{ !cancelled() && needs.verify.result == 'success' && needs.formal-models.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      TINCANBAN_REQUIRE_LIGHTHOUSE_E2E: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/checkout@v7
        with:
          repository: bobishh/rusty
          ref: 06feb38459be9b48b4d492c6d95de59bca96fa7b
          path: rusty-lifecycle
      - name: Move Rusty checkout outside Tincanban Cargo workspace
        run: cp -a "$GITHUB_WORKSPACE/rusty-lifecycle" "$RUNNER_TEMP/rusty-lifecycle"
      - uses: dtolnay/rust-toolchain@stable
      - name: Build pinned Rusty admin frontend
        working-directory: ${{ runner.temp }}/rusty-lifecycle/frontend
        env:
          MATCH_UI_SOURCE: ${{ github.workspace }}/src
        run: |
          npm ci
          npm run build
      - name: Build pinned Rusty lifecycle fixture binary
        run: cargo build --locked --features e2e-fixture --manifest-path "$RUNNER_TEMP/rusty-lifecycle/Cargo.toml" --bin mesh-lighthouse
      - name: Require canonical Rusty test binary
        run: |
          echo "TINCANBAN_LIGHTHOUSE_BINARY=$RUNNER_TEMP/rusty-lifecycle/target/debug/mesh-lighthouse" >> "$GITHUB_ENV"
          echo "TINCANBAN_LIGHTHOUSE_MANIFEST=$RUNNER_TEMP/rusty-lifecycle/Cargo.toml" >> "$GITHUB_ENV"
      - name: Use Ubuntu primary archive mirror for Chromium dependencies
        run: bash scripts/use-primary-ubuntu-mirror.sh
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --reporter=list --project=lighthouse-keeper-provisioning
      - uses: actions/upload-artifact@v6
        if: failure() || cancelled()
        with:
          name: browser-rusty-keeper-lifecycle-failure
          path: test-results/
          retention-days: 3

  browser-policy:
    name: Browser (production policy/transport packaging)
    needs: [verify, formal-models]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify:meta-mesh
      - name: Use Ubuntu primary archive mirror for Chromium dependencies
        run: bash scripts/use-primary-ubuntu-mirror.sh
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e:policy
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: policy-packaging-failure
          path: test-results/
          retention-days: 3

  browser-native:
    name: Browser (native Rust peer)
    needs: [verify, formal-models]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify:meta-mesh
      - name: Use Ubuntu primary archive mirror for Chromium dependencies
        run: bash scripts/use-primary-ubuntu-mirror.sh
      - run: npx playwright install --with-deps chromium
      - run: cargo build --locked --manifest-path vendor/meta-mesh/crates/meta-mesh-native/Cargo.toml --example browser_document_probe
      - run: npx playwright test --reporter=list --project=browser-native
